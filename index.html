canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
const avg = (k) => { let s = 0; for (const p of touches.values()) s += p[k]; return s / (touches.size || 1); };
const pinchDistance = () => { const p = [...touches.values()]; return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey) { ui.zoom(Math.exp(-e.deltaY * 0.0025), e.offsetX, e.offsetY); return; }
  const at = ui.toSource(e.offsetX, e.offsetY); if (!at) return;
  // Pixels to wheel notches (a notch is 120 on the wire, about 100 browser pixels).
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1;
  input(IN.MOVE, at[0], at[1]);
  const sign = cfg().natural ? -1 : 1, speed = 1.2 * cfg().scroll * sign;
  input(IN.SCROLL, Math.round(e.deltaX * k * speed), Math.round(-e.deltaY * k * speed));
}, { passive: false });

function keyEvent(e, down) {
  if (!live() || !app.stage || e.target.closest('dialog, #compose')) return;
  const vk = VK[e.code];
  const printable = e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey;
  // A latched modifier turns the next character into a shortcut, as on the phone.
  if (printable && latched.size) {
    e.preventDefault();
    if (down) { const k = VK[e.code]; if (k) press(k); }
    return;
  }
  // Characters go as characters, so they come out right whatever layout the PC has; everything
  // else — arrows, function keys, shortcuts — goes as the key it is.
  if (printable) { e.preventDefault(); if (down) typeText(0, e.key); return; }
  if (vk === undefined) return;
  e.preventDefault();
  input(IN.KEY, vk, down ? 1 : 0);
}
window.addEventListener('keydown', (e) => keyEvent(e, true), true);
window.addEventListener('keyup', (e) => keyEvent(e, false), true);
// A key held while the window loses focus would otherwise stay held on the PC.
window.addEventListener('blur', () => { for (const code of MODIFIER_CODES) input(IN.KEY, VK[code], 0); });

// ── the compose bar: what is typed here appears on the PC as it is typed ────────────────────
/** Keeps the PC's text in step with a box: what changed becomes backspaces and the text after them. */
class Mirror {
  constructor(send) { this.sent = []; this.send = send; }
  reset() { this.sent = []; }
  push(text) {
    const cur = graphemes(text);
    let p = 0;
    while (p < cur.length && p < this.sent.length && cur[p] === this.sent[p]) p++;
    const back = this.sent.length - p, add = cur.slice(p).join('');
    if (back || add) this.send(Math.min(back, 0xffff), add);
    this.sent = cur;
  }
}
const mirror = new Mirror(typeText);
const ctext = $('ctext');
let composing = false, flushTimer = 0;
function compose() { return !$('compose').hidden; }
function grow() { ctext.style.height = 'auto'; ctext.style.height = Math.min(ctext.scrollHeight, 120) + 'px'; }
function flush() { clearTimeout(flushTimer); if (cfg().typeLive) mirror.push(ctext.value); }
ctext.addEventListener('input', () => {
  grow();
  if (!cfg().typeLive) return;
  // Gboard and friends rewrite a word while it is being composed; waiting a beat sends the settled word.
  if (composing) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 160); } else flush();
});
ctext.addEventListener('compositionstart', () => { composing = true; });
ctext.addEventListener('compositionend', () => { composing = false; flush(); });
ctext.addEventListener('beforeinput', (e) => {
  // A latched modifier makes the next typed character a shortcut instead of text.
  if (latched.size && e.inputType === 'insertText' && e.data && e.data.length === 1) {
    e.preventDefault();
    const k = e.data.toUpperCase().charCodeAt(0);
    if ((k >= 0x41 && k <= 0x5a) || (k >= 0x30 && k <= 0x39)) press(k);
  }
});
function send() {
  if (!live()) return;
  if (cfg().typeLive) mirror.push(ctext.value); else typeText(0, ctext.value);
  press(0x0d, []);
  ctext.value = ''; mirror.reset(); grow(); buzz();
  ctext.focus();
}
$('csend').onclick = send;
ctext.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); send(); } });
function openCompose() {
  $('compose').hidden = false; $('chipKb').classList.add('on');
  mirror.reset(); ctext.value = ''; grow();
  setTimeout(() => ctext.focus(), 30);
  fitKeyboard();
}
function closeCompose() {
  $('compose').hidden = true; $('chipKb').classList.remove('on');
  try { ctext.blur(); } catch {}
  clearTimeout(flushTimer);
  mirror.reset(); ctext.value = '';
  $('stage').style.removeProperty('--kb');
  canvas.focus({ preventScroll: true });
}
$('chipKb').onclick = () => (compose() ? closeCompose() : openCompose());
// A soft keyboard covers the bottom of the page; the bar rides above it.
function fitKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  $('stage').style.setProperty('--kb', covered + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitKeyboard); visualViewport.addEventListener('scroll', fitKeyboard); }

// The keys a phone keyboard lacks, and the modifiers behind the "Keys" chip.
for (const [label, vk] of KEYS) {
  const b = el('button', { type: 'button', text: label, 'aria-label': label });
  b.onclick = () => { press(vk); buzz(); };
  $('keybar').append(b);
}
const modButtons = new Map();
for (const [label, vk] of MODIFIERS) {
  const b = el('button', { class: 'chip wide', type: 'button', text: label, 'aria-pressed': 'false', title: 'Tap to hold it for the next key. Hold the button to press it on its own.' });
  let held = false, timer = 0;
  b.onpointerdown = () => { held = false; timer = setTimeout(() => { held = true; press(vk, [...latched].filter((m) => m !== vk)); buzz(15); }, 500); };
  b.onpointerup = b.onpointerleave = () => clearTimeout(timer);
  b.onclick = () => { if (held) return; if (!latched.delete(vk)) latched.add(vk); paintMods(); buzz(); };
  modButtons.set(vk, b); $('mods').append(b);
}
let modsOpen = false;
function paintMods() {
  for (const [vk, b] of modButtons) { b.classList.toggle('on', latched.has(vk)); b.setAttribute('aria-pressed', String(latched.has(vk))); }
  const heldNames = MODIFIERS.filter(([, vk]) => latched.has(vk)).map(([n]) => n);
  // Folded away with something held, the chip names it: a latch nobody can see is a trap.
  $('keysChip').textContent = modsOpen || !heldNames.length ? 'Keys' : heldNames.join('+');
  $('keysChip').classList.toggle('on', heldNames.length > 0);
  $('mods').hidden = !modsOpen;
  $('keysChip').setAttribute('aria-expanded', String(modsOpen));
}
$('keysChip').onclick = () => { modsOpen = !modsOpen; paintMods(); };
paintMods();

// ── the chips ────────────────────────────────────────────────────────────────────────────────
/** Ask for the PC's sound: raw PCM on a fast path, AAC when the path is not, as the phone chooses. */
function requestAudio(on) {
  const s = app.session; if (!s || !s.alive) return;
  if (on) {
    ui.sound.start();
    const aac = Sound.aacOk() && ui.pathKind !== 'local';
    s.send(Uint8Array.of(C.AUDIO, aac ? 2 : 1));
  } else {
    s.send(Uint8Array.of(C.AUDIO, 0));
    ui.sound.stop();
  }
}
$('chipAudio').onclick = () => {
  if (!live()) return;
  ui.wantAudio = !ui.wantAudio;
  requestAudio(ui.wantAudio);
  $('chipAudio').classList.toggle('on', ui.wantAudio); $('chipAudio').setAttribute('aria-pressed', String(ui.wantAudio));
  toast(ui.wantAudio ? 'PC sound on. The PC itself is muted while you listen.' : 'PC sound off');
};
$('chipDark').onclick = () => {
  if (!live()) return;
  ui.wantDark = !ui.wantDark;
  app.session.send(Uint8Array.of(C.DISPLAY, ui.wantDark ? 0 : 1));
  $('chipDark').classList.toggle('on', ui.wantDark); $('chipDark').setAttribute('aria-pressed', String(ui.wantDark));
  toast(ui.wantDark ? 'The PC\'s own screen is dark. Touch its keyboard to bring it back.' : 'The PC\'s screen is back');
};
if (!$('stage').requestFullscreen) $('chipFull').hidden = true;
$('chipFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else $('stage').requestFullscreen && $('stage').requestFullscreen().catch(() => {}); };
// Landscape is the shape of a desktop; a phone held upright gets a postage stamp. Pinning needs full screen.
if (screen.orientation && screen.orientation.lock) $('chipRotate').hidden = false;
$('chipRotate').onclick = async () => {
  try {
    if (!document.fullscreenElement) await $('stage').requestFullscreen();
    const landscape = screen.orientation.type.startsWith('landscape');
    await screen.orientation.lock(landscape ? 'portrait' : 'landscape');
    $('chipRotate').classList.toggle('on', !landscape);
  } catch { toast('This browser will not turn the screen. Rotate the phone instead.'); }
};
$('zoomIn').onclick = () => ui.zoom(1.5);
$('zoomOut').onclick = () => ui.zoom(1 / 1.5);
$('leave').onclick = () => ui.leave();
document.addEventListener('fullscreenchange', () => ui.resize());

let hideTimer = 0;
function showChips(keep) {
  for (const id of ['chips', 'backChips', 'leftcol']) $(id).classList.remove('hide');
  $('hud').classList.remove('idle');
  clearTimeout(hideTimer);
  // On a touch screen a tap that only reveals the buttons would also click the PC, so they stay.
  if (!keep && cfg().autohide && !matchMedia('(pointer: coarse)').matches) hideTimer = setTimeout(() => {
    if (compose() || modsOpen || !ui.pictureShown) return;
    for (const id of ['chips', 'backChips', 'leftcol']) $(id).classList.add('hide');
    $('hud').classList.add('idle');
  }, 4000);
}
$('stage').addEventListener('pointermove', () => showChips());
$('stage').addEventListener('pointerdown', () => showChips());
window.addEventListener('resize', () => { ui.resize(); fitKeyboard(); });
window.addEventListener('orientationchange', () => setTimeout(() => ui.resize(), 200));

// What is actually arriving, once a second.
let last = performance.now(), lastFrames = 0;
setInterval(() => {
  const now = performance.now(), n = ui.frames;
  if (cfg().hud && live() && ui.frame) {
    const fps = Math.round(((n - lastFrames) * 1000) / (now - last));
    const where = { local: 'Same network', direct: 'Direct', relay: 'Relayed' }[ui.pathKind] || 'Connected';
    $('hud').textContent = `${where} · ${fps} fps`;
  } else $('hud').textContent = '';
  $('hud').hidden = !(cfg().hud && app.stage && ui.frame);
  last = now; lastFrames = n;
}, 1000);

// ── boot ─────────────────────────────────────────────────────────────────────────────────────
// A link from the PC carries its id after the #, sometimes its pairing code, and sometimes the
// relay it uses. With a code, opening the link opens the pairing sheet filled in and pairs at once;
// with only the id it lands on the password sheet.
(function boot() {
  applyOptions();
  renderHome();
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const linked = hostIdFrom(params.get('pc') || '');
  const linkedCode = (params.get('code') || '').trim();
  const turn = turnUrls((params.get('turn') || '').trim()).join('\n');
  if (turn) {
    Object.assign(cfg(), { turn, turnUser: params.get('tu') || '', turnPass: params.get('tp') || '' });
    persist();
  }
  if (linked) { mem.lastHost = linked; persist(); }
  if (linked || linkedCode || turn) history.replaceState(null, '', location.pathname + location.search);
  if (turn) toast('Relay added from the link.');
  if (linkedCode && looksLikeCode(linkedCode)) {
    const { submit } = pairSheet(linkedCode);
    submit();
  } else if (linked) {
    passwordSheet(linked);
  } else if (!mem.pcs.length) {
    // First visit: the code is the way in, so the sheet is already open for it.
    pairSheet();
  }
})();

// For testing from the console: window.freewatch.
window.freewatch = { ui, app, mem, connect, panel, tally, note, strict, explainPath, Mirror, Session, Out, parseRelay, turnUrls, graphemes, passwordKeys, EFFORT_LIMITS, normaliseCode, looksLikeCode, hostIdFrom, nalUnits, nalOfType };
</script>
