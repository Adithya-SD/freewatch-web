<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#09090b">
<title>FreeWatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff4d97'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='23' cy='9' r='2.4' fill='white'/%3E%3C/svg%3E">
<style>
  /* The same look as the phone and watch apps: near-black, one pink accent, rounded cards, bottom sheets. */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --raised: #ececf0; --line: #dcdce3;
    --text: #151518; --dim: #5d5d69; --faint: #8d8d98;
    --accent: #e8337c; --on-accent: #ffffff; --ok: #14a46a; --warn: #c98a12; --danger: #d33c3c;
    --scrim: rgba(20,20,26,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #09090b; --surface: #121215; --raised: #1b1b20; --line: #27272e;
      --text: #f4f4f5; --dim: #9b9ba6; --faint: #6c6c77;
      --accent: #ff4d97; --on-accent: #1a0710; --ok: #3ecf8e; --warn: #f5b544; --danger: #ff6b6b;
      --scrim: rgba(0,0,0,.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --surface: #121215; --raised: #1b1b20; --line: #27272e;
    --text: #f4f4f5; --dim: #9b9ba6; --faint: #6c6c77;
    --accent: #ff4d97; --on-accent: #1a0710; --ok: #3ecf8e; --warn: #f5b544; --danger: #ff6b6b;
    --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── screens: home and settings scroll; the viewer is fixed ── */
  .screen { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
  .col { width: min(560px, 100%); margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px); display: grid; gap: 0; align-content: start; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 56px; margin-bottom: 4px; }
  .top h1 { flex: 1; font-size: 26px; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
  .icon { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; display: grid; place-items: center; color: var(--text); flex: none; }
  .icon:hover { background: var(--raised); }
  .icon svg { width: 22px; height: 22px; }
  svg.i { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .notice { margin: 4px 0 0; font-size: 14px; color: var(--dim); }
  .heading { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 26px 2px 10px; }
  .stack { display: grid; gap: 10px; }

  .card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; min-height: 64px; text-align: left; width: 100%; }
  button.card, .card.tap { cursor: pointer; transition: transform .08s, background .15s; }
  button.card:active { transform: scale(.985); }
  button.card:hover { background: var(--raised); }
  .card .t { flex: 1; min-width: 0; }
  .card .t b { display: block; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .t span { display: block; font-size: 13px; color: var(--dim); }
  .card .t.wrap b { white-space: normal; }
  .badge { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--raised); color: var(--dim); flex: none; }
  .badge.accent { color: var(--accent); }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }

  .btn { border: 0; border-radius: 16px; padding: 15px 20px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; width: 100%; min-height: 52px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.small { width: auto; padding: 9px 16px; min-height: 40px; font-size: 14px; border-radius: 12px; }
  .linkbtn { background: none; border: 0; color: var(--dim); font-weight: 600; font-size: 14px; padding: 14px 20px; min-height: 48px; border-radius: 14px; }
  .linkbtn:hover { background: var(--raised); }
  .center { text-align: center; }

  /* ── switches, segmented, fields ── */
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); transition: background .15s; pointer-events: none; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
  .switch input:checked + i { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + i::after { transform: translateX(20px); background: var(--on-accent); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  .seg label { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--dim); cursor: pointer; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--raised); color: var(--text); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 12px; color: var(--dim); font-weight: 600; }
  .in { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 16px; min-height: 52px; }
  .in.code { font-size: 24px; letter-spacing: .2em; text-align: center; text-transform: uppercase; font-weight: 700; }
  textarea.in { min-height: 76px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .check { display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .sub { font-size: 13px; color: var(--dim); margin: 0; }
  .msg { font-size: 14px; margin: 0; min-height: 20px; color: var(--dim); }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  .strength { height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .strength i { display: block; height: 100%; width: 0; background: var(--danger); transition: width .2s, background .2s; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* ── sheets ── */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: min(560px, 100%); max-width: 100%; max-height: 92%; background: var(--surface); color: var(--text);
                 border-radius: 28px 28px 0 0; border-top: 1px solid var(--line); overflow: auto; }
  dialog.sheet::backdrop { background: var(--scrim); }
  dialog.sheet[open] { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
  @media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 28px; border: 1px solid var(--line); } }
  .sheet .in-sheet { display: grid; gap: 14px; padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 6px; }
  .sheet h2 { font-size: 20px; margin: 8px 0 0; letter-spacing: -.01em; }
  .sheet .choice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--raised); border: 0; width: 100%; text-align: left; }
  .sheet .choice b { display: block; } .sheet .choice span { display: block; font-size: 13px; color: var(--dim); }
  .diag { display: grid; gap: 8px; }
  .diag .row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; font-size: 14px; padding: 10px 14px; border-radius: 12px; background: var(--raised); }
  .diag .row span:first-child { color: var(--dim); }
  .diag .row b { font-weight: 600; text-align: right; }
  .diag .row b.ok { color: var(--ok); } .diag .row b.bad { color: var(--danger); } .diag .row b.warn { color: var(--warn); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--raised); color: var(--text); max-width: calc(100% - 32px);
           border: 1px solid var(--line); border-radius: 16px; padding: 12px 18px; font-size: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.35); z-index: 50; animation: rise .2s ease-out; }

  /* ── viewer ── */
  #stage { position: fixed; inset: 0; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; color: #f4f4f5; --text: #f4f4f5; --dim: #9b9ba6; --surface: #121215; --raised: #1b1b20; --line: #27272e; --accent: #ff4d97; --on-accent: #1a0710; --faint: #6c6c77; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: none; touch-action: none; }
  .chips { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); display: grid; gap: 8px; transition: opacity .25s, transform .25s; }
  .chips.left { right: auto; left: calc(env(safe-area-inset-left, 0px) + 10px); }
  .hide { opacity: 0; pointer-events: none; transform: translateX(8px); }
  .chips.left.hide { transform: translateX(-8px); }
  .chip { width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(9,9,11,.62); color: #f4f4f5; display: grid; place-items: center; backdrop-filter: blur(8px); font-weight: 700; font-size: 13px; }
  .chip svg { width: 22px; height: 22px; }
  .chip.on { color: var(--accent); background: rgba(255,77,151,.18); }
  .chip.wide { width: auto; padding: 0 14px; }
  .chip:active { transform: scale(.94); }
  .modrow { display: flex; gap: 8px; flex-wrap: wrap; }
  #hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 66px); padding: 8px 14px; border-radius: 999px; background: rgba(9,9,11,.62); font-size: 13px; font-weight: 600; backdrop-filter: blur(8px); transition: opacity .4s; pointer-events: none; font-variant-numeric: tabular-nums; }
  #hud.idle { opacity: .0; }
  #leftcol { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 62px); left: calc(env(safe-area-inset-left, 0px) + 10px); display: grid; gap: 8px; justify-items: start; transition: opacity .25s; }
  #leftcol.hide { opacity: 0; pointer-events: none; }

  #panel { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #09090b; }
  #panel.over { background: rgba(0,0,0,.6); }
  #panel .box { width: min(420px, 100%); background: #121215; border-radius: 28px; padding: 28px 24px; display: grid; justify-items: center; gap: 10px; text-align: center; }
  #panel h2 { margin: 6px 0 0; font-size: 20px; }
  #panel p { margin: 0; color: #9b9ba6; font-size: 15px; white-space: pre-line; }
  #panel .btn { margin-top: 10px; }
  .spin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #27272e; border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } dialog.sheet[open], .toast { animation: none; } }

  #compose { position: absolute; left: 0; right: 0; bottom: var(--kb, 0px); padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px); background: rgba(9,9,11,.92); display: grid; gap: 8px; backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  #keybar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #keybar::-webkit-scrollbar { display: none; }
  #keybar button { flex: none; min-width: 46px; height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: #1b1b20; font-weight: 700; font-size: 14px; }
  #keybar button.on { background: rgba(255,77,151,.22); color: var(--accent); }
  #composeRow { display: flex; gap: 8px; align-items: flex-end; }
  #ctext { flex: 1; min-height: 46px; max-height: 120px; resize: none; border-radius: 14px; border: 1px solid var(--line); background: #1b1b20; padding: 12px 14px; font-size: 16px; line-height: 1.3; }
  #csend { height: 46px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  @media (pointer: coarse) { .fine-only { display: none !important; } }
  @media (pointer: fine) { .coarse-only { display: none !important; } }
</style>
</head>
<body>

<!-- ═══ home ═══ -->
<main id="home" class="screen">
  <div class="col">
    <div class="top">
      <h1>FreeWatch</h1>
      <button class="icon" id="openSettings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <p class="notice" id="notice" hidden></p>
    <p class="heading">Computers</p>
    <div class="stack" id="pcs"></div>
    <div class="stack" style="margin-top:22px">
      <button class="btn" id="pairBtn">Pair a PC</button>
      <button class="btn ghost" id="passBtn">Sign in with password</button>
      <button class="linkbtn center" id="doctorBtn">Check my connection</button>
    </div>
    <p class="sub center" style="margin-top:22px">The picture travels straight between your PC and this browser, encrypted. This page keeps a secret key for each PC in this browser only; clearing site data forgets them.</p>
  </div>
</main>

<!-- ═══ settings ═══ -->
<div id="settings" class="screen" hidden>
  <div class="col">
    <div class="top">
      <button class="icon" id="settingsBack" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1>Settings</h1>
    </div>
    <div id="settingsBody"></div>
  </div>
</div>

<!-- ═══ viewer ═══ -->
<div id="stage" hidden>
  <canvas id="view" tabindex="0" aria-label="Remote screen"></canvas>
  <div id="hud" hidden></div>
  <div class="chips left" id="backChips"><button class="chip" id="leave" aria-label="Back to computers" title="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div id="leftcol">
    <button class="chip wide" id="keysChip" aria-label="Modifier keys" aria-expanded="false">Keys</button>
    <div class="modrow" id="mods" hidden></div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" id="chipKb" aria-label="Keyboard" title="Keyboard"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <button class="chip coarse-only" id="chipRotate" aria-label="Rotate" title="Landscape" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 11a8 8 0 0114-4l2 2M20 4v5h-5M20 13a8 8 0 01-14 4l-2-2M4 20v-5h5"/></svg></button>
    <button class="chip" id="chipAudio" aria-label="PC sound" title="PC sound" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
    <button class="chip" id="chipDark" aria-label="Turn the PC screen down" title="PC screen" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button class="chip fine-only" id="zoomIn" aria-label="Zoom in" title="Zoom in (Ctrl + scroll)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M8.5 11h5M11 8.5v5"/></svg></button>
    <button class="chip fine-only" id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M8.5 11h5"/></svg></button>
    <button class="chip" id="chipFull" aria-label="Full screen" title="Full screen"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="chip" id="chipPass" aria-label="Permanent password" title="Permanent password"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L19 4m-3 3l2.5 2.5M14 9l2 2"/></svg></button>
  </div>
  <div id="compose" hidden>
    <div id="keybar" role="toolbar" aria-label="Keys"></div>
    <div id="composeRow">
      <textarea id="ctext" rows="1" placeholder="Type…" enterkeyhint="enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type on the PC"></textarea>
      <button id="csend" type="button">Send</button>
    </div>
  </div>
  <div id="panel">
    <div class="box">
      <div class="spin" id="spin"></div>
      <h2 id="pTitle">Connecting…</h2>
      <p id="pText"></p>
      <button class="btn" id="pAction" hidden>Retry now</button>
      <button class="btn ghost" id="pBack">Back</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
/*
 * FreeWatch in a browser.
 *
 * The same conversation the phone app has with the PC, from a web page: find the PC through the
 * PeerJS broker, open one WebRTC data channel to it, prove which PC it is and which browser this
 * is with an HMAC challenge, then read H.264 frames off the channel and decode them with WebCodecs.
 * Nothing is installed and nothing is hosted: this file is the whole client.
 *
 * The screens, the words and the settings follow the phone app (android/phone): the same home, the
 * same pairing and password sheets, the same connection panel, the same chips and compose bar.
 *
 * The wire protocol is documented in host/src/net.rs and android/shared/.../Protocol.kt; the
 * numbers below are those.
 */

// ── constants ──────────────────────────────────────────────────────────────────────────────────
const DEFAULTS = {
  broker: 'wss://0.peerjs.com/peerjs',
  stun: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'],
  turn: '', turnUser: '', turnPass: '', policy: 'all',
  // Picture and feel: the phone's own settings, in the phone's own words.
  effort: 3, hud: true, wake: true, typeLive: true, haptics: true,
  // What only a browser has.
  pointer: true, fit: 'contain', scroll: 1, natural: false, longpress: true, reconnect: true, autohide: true, theme: 'auto',
};
/** Picture effort: what each step asks the PC to send, as [fps, kbps] direct and [fps, kbps] relayed. */
const EFFORTS = ['Battery saver', 'Balanced', 'Smooth', 'Full'];
const EFFORT_LIMITS = [[15, 1500, 10, 800], [30, 4000, 20, 2000], [45, 8000, 30, 4000], null];
const PBKDF2_ROUNDS = 600000;
const C = { HELLO: 1, ROI: 2, INPUT: 3, PING: 4, IDENT: 5, TEXT: 6, AUDIO: 7, DISPLAY: 8, AUTH: 9, PAIR: 10, PASSWORD: 12, SETPASS: 13, LIMITS: 14, ROLE: 15 };
const S = { CONFIG: 0x81, FRAME: 0x82, IDENT: 0x83, PONG: 0x84, FOCUS: 0x85, CURSOR: 0x86, AUDIO: 0x87,
            CHALLENGE: 0x88, AUTH: 0x89, FIELD: 0x8a };
const CAP = { LIMITS: 2, ROLE: 4 };
const IN = { MOVE: 1, BUTTON: 3, SCROLL: 4, KEY: 5 };
const AUTH = { OK: 0, PAIRED: 1, DENIED: 2, BAD_CODE: 3, LOCKED: 4 };
const enc = new TextEncoder();
const dec = new TextDecoder();
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
};

// ── small helpers ──────────────────────────────────────────────────────────────────────────────
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
const unhex = (s) => Uint8Array.from(s.match(/../g) || [], (h) => parseInt(h, 16));
const rand = (n) => hex(crypto.getRandomValues(new Uint8Array(n)));
const concat = (...parts) => {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
};
const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const normaliseCode = (s) => s.toUpperCase().replace(/[-\s]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');

/** Build a message from numbers, big-endian, the way the protocol wants. */
class Out {
  constructor() { this.a = []; }
  u8(v) { this.a.push(v & 255); return this; }
  u16(v) { return this.u8(v >> 8).u8(v); }

  raw(b) { for (const x of b) this.a.push(x); return this; }

// ── what this browser remembers ───────────────────────────────────────────────────────────────
const KEY = 'freewatch.web.v1';

mem.pcs ||= [];

/** The modifiers and the extra keys a phone keyboard lacks, as the phone app offers them. */
const MODIFIERS = [['Ctrl', 0x11], ['Shift', 0x10], ['Alt', 0x12], ['Win', 0x5b]];
const KEYS = [['Esc', 0x1b], ['Tab', 0x09], ['Del', 0x2e], ['Home', 0x24], ['End', 0x23], ['PgUp', 0x21], ['PgDn', 0x22],
              ['←', 0x25], ['↑', 0x26], ['↓', 0x28], ['→', 0x27]];

const brokerUrl = () => {
  const u = (cfg().broker || DEFAULTS.broker).trim().replace(/\/+$/, '');
  return /^wss?:\/\//.test(u) ? u : DEFAULTS.broker;
};
/** The relay addresses typed or pasted, however they were separated. */
const turnUrls = (text) => String(text || '').split(/[\s,]+/).filter((u) => /^turns?:/i.test(u));
const iceServers = () => {
  const servers = [];
  const stun = cfg().stun.filter((x) => x.trim());
  if (stun.length) servers.push({ urls: stun });
  const turn = turnUrls(cfg().turn);
  if (turn.length) servers.push({ urls: turn, username: cfg().turnUser, credential: cfg().turnPass });
  return servers;
};
/**
 * What a relay provider's dashboard hands out, in whichever form: the `iceServers` JSON their
 * quick-start shows, or plain `turn:` lines. Returns `{ turn, user, pass }` or null.
 */
function parseRelay(text) {
  const t = String(text || '').trim();
  if (!t) return null;
  let list = null;
  if (/^[\[{]/.test(t)) {
    try { const j = JSON.parse(t); list = Array.isArray(j) ? j : Array.isArray(j.iceServers) ? j.iceServers : [j]; } catch { return null; }
    const urls = [], first = {};
    for (const e of list) {
      const u = [].concat(e.urls || e.url || []).filter((x) => /^turns?:/i.test(x));
      if (!u.length) continue;
      urls.push(...u);
      if (!first.user && e.username) { first.user = e.username; first.pass = e.credential || ''; }
    }
    return urls.length ? { turn: urls.join('\n'), user: first.user || '', pass: first.pass || '' } : null;
  }
  const urls = turnUrls(t);
  return urls.length ? { turn: urls.join('\n'), user: '', pass: '' } : null;
}

// ── what a network offers, counted from candidate lines ──────────────────────────────────────
/** Tally the candidates one end offers: how many of each kind, whether any are IPv6, and how its router maps it. */
function tally() { return { host: 0, srflx: 0, srflx4: 0, relay: 0, v6: 0, maps: new Map() }; }
function note(t, line) {
  const f = line.replace(/^candidate:/, '').split(/\s+/);
  const type = f[f.indexOf('typ') + 1];
  if (!type || f.length < 8) return;
  if (type === 'host' || type === 'prflx') t.host++;
  else if (type === 'srflx') {
    t.srflx++;
    if (!(f[4] || '').includes(':')) t.srflx4++;
    // The same inside address seen from two servers under two outside ports is a router that
    // changes its answer per destination, which is the kind no hole can be punched through.
    const base = f[f.indexOf('raddr') + 1] + ':' + f[f.indexOf('rport') + 1];
    if (!t.maps.has(base)) t.maps.set(base, new Set());
    t.maps.get(base).add(f[4] + ':' + f[5]);
  } else if (type === 'relay') t.relay++;
  if ((f[4] || '').includes(':')) t.v6++;
}
const strict = (t) => [...t.maps.values()].some((s) => s.size > 1);

/** Why a link that found the PC could not open, said in the one way a person can act on. */
function explainPath(info) {
  const l = info.local, r = info.remote, lines = [];
  if (!l.srflx && !l.relay && !l.v6) lines.push('This browser found no public address, so nothing outside can find it. Usual causes: a network that blocks UDP (school, office, some hotspots), a VPN, or a privacy setting that hides WebRTC (Brave Shields, Firefox privacy, WebRTC-blocking extensions).');
  else if (strict(l)) lines.push('This network gives out a different address for every destination, which mobile data usually does, so a direct link cannot open.');
  else if (l.v6 && !l.srflx4 && !l.relay && !r.v6) lines.push('This network is IPv6 only (mobile data often is), and the PC has no IPv6 address, so the two have nothing in common. Connect the PC to a Wi-Fi or hotspot that gives it an IPv6 address, or set up a relay.');
  else if (!r.srflx && !r.v6 && !r.relay) lines.push('The PC offered no public address. It may be offline from the internet.');
  else lines.push('The two could not find a direct path.');
  lines.push(turnUrls(cfg().turn).length ? 'The relay you set up did not carry it either; check its address and password.' : 'Put this device on the same Wi-Fi as the PC, or set up a relay in Settings.');
  return lines.join(' ');
}

// ── the link: broker, WebRTC, one data channel ────────────────────────────────────────────────
/**
 * Open a data channel to the PC registered under `target`. Resolves with `{ send, close, path }`
 * once the channel is open; `on.bytes` gets every message, `on.close` fires once when it ends.
 * Rejects with an error whose `kind` says how far it got: `broker` (the connection service was
 * out of reach), `offline` (nobody answered under that name) or `path` (the PC answered but no
 * route opened), and whose `info` holds what each side offered.
 */
function openLink(target, on) {
  return new Promise((resolve, reject) => {
    const me = 'fwweb' + rand(7);
    const connection = 'dc_' + rand(6);
    const info = { local: tally(), remote: tally(), answered: false };
    let ws;
    try { ws = new WebSocket(`${brokerUrl()}?key=peerjs&id=${me}&token=${rand(6)}&version=1.5.4`); }
    catch { reject(Object.assign(new Error('The connection service address is not valid. Check Settings.'), { kind: 'broker', info })); return; }
    let pc = null, channel = null, beat = null, settled = false, closed = false, opened = false, timer = null;
    const finish = (kind, message) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      shutdown();
      reject(Object.assign(new Error(message), { kind, info }));
    };
    const shutdown = () => {
      clearInterval(beat);
      try { ws.close(); } catch {}
      try { channel && channel.close(); } catch {}
      try { pc && pc.close(); } catch {}
    };
    const arm = (ms, kind, message) => { clearTimeout(timer); timer = setTimeout(() => finish(kind, typeof message === 'function' ? message() : message), ms); };
    arm(25000, 'offline', 'Nothing answered. Is the PC on, awake and running FreeWatch?');
    const say = (m) => ws.readyState === 1 && ws.send(JSON.stringify(m));

    ws.onerror = () => { if (!opened) finish('broker', 'Could not reach the connection service. Check this device\'s internet.'); };
    ws.onclose = () => { if (!settled && !info.answered) finish(opened ? 'offline' : 'broker', opened ? 'The connection service closed the link.' : 'Could not reach the connection service. Check this device\'s internet.'); };
    ws.onmessage = async (event) => {
      let m;
      try { m = JSON.parse(event.data); } catch { return; }
      const body = m.payload || {};
      try {
        if (m.type === 'OPEN') {
          opened = true;
          beat = setInterval(() => say({ type: 'HEARTBEAT' }), 10000);
          pc = new RTCPeerConnection({ iceServers: iceServers(), iceTransportPolicy: cfg().policy === 'relay' ? 'relay' : 'all' });
          channel = pc.createDataChannel(connection, { ordered: true });
          channel.binaryType = 'arraybuffer';
          channel.onopen = () => {
            if (settled) return;
            settled = true; clearTimeout(timer); clearInterval(beat);
            try { ws.close(); } catch {}
            resolve({
              send: (bytes) => { if (channel.readyState === 'open') channel.send(bytes); },
              buffered: () => channel.bufferedAmount,
              close: () => { closed = true; shutdown(); },
              info,
              /** `local` (same network), `direct` (across the internet) or `relay`. */
              path: async () => {
                try {
                  const stats = await pc.getStats();
                  let pair = null;
                  stats.forEach((s) => { if (s.type === 'transport' && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId); });
                  if (!pair) stats.forEach((s) => { if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s; });
                  if (!pair) return 'direct';
                  const a = stats.get(pair.localCandidateId), b = stats.get(pair.remoteCandidateId);
                  if ((a && a.candidateType === 'relay') || (b && b.candidateType === 'relay')) return 'relay';
                  if (a && b && a.candidateType === 'host' && b.candidateType === 'host') return 'local';
                  return 'direct';
                } catch { return 'direct'; }
              },
            });
          };
          channel.onmessage = (e) => on.bytes(new Uint8Array(e.data));
          channel.onclose = () => { if (!closed && settled) { closed = true; on.close && on.close(); } };
          // Candidates can appear while the offer is still being made. The PC knows nothing of this
          // connection until the offer arrives and drops anything sent before it, so they wait here.
          const early = []; let offered = false;
          pc.onicecandidate = (e) => {
            if (!e.candidate) return;
            note(info.local, e.candidate.candidate);
            const m = {
              type: 'CANDIDATE', dst: target,
              payload: { candidate: { candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex }, type: 'data', connectionId: connection },
            };
            if (offered) say(m); else early.push(m);
          };
          // A network switch leaves the channel "disconnected" for tens of seconds before it is
          // called failed; a path that has not come back in eight seconds is not coming back.
          let stale = null;
          pc.onconnectionstatechange = () => {
            const s = pc.connectionState;
            if (s === 'failed') {
              if (!settled) finish('path', 'The PC answered, but no path opened between it and this browser. ' + explainPath(info));
              else if (!closed) { closed = true; shutdown(); on.close && on.close(); }
            }
            if (s === 'disconnected' && settled) { clearTimeout(stale); stale = setTimeout(() => { if (pc.connectionState !== 'connected' && !closed) { closed = true; shutdown(); on.close && on.close(); } }, 8000); }
            if (s === 'connected') clearTimeout(stale);
          };
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          say({ type: 'OFFER', dst: target, payload: { sdp: { type: offer.type, sdp: offer.sdp }, type: 'data', connectionId: connection, label: connection, reliable: true, serialization: 'raw', browser: 'chrome' } });
          offered = true;
          early.splice(0).forEach(say);
        } else if (m.type === 'ANSWER' && body.connectionId === connection && pc) {
          info.answered = true;
          // The PC is there. What is left is the path, and thirty seconds is longer than any path takes.
          arm(30000, 'path', () => 'The PC answered, but no path opened between it and this browser. ' + explainPath(info));
          await pc.setRemoteDescription(body.sdp);
        } else if (m.type === 'CANDIDATE' && body.connectionId === connection && pc && body.candidate) {
          note(info.remote, body.candidate.candidate || '');
          try { await pc.addIceCandidate(body.candidate); } catch {}
        } else if (m.type === 'EXPIRE') {
          finish('offline', 'That PC is not online. Is it on, awake, and running FreeWatch?');
        } else if (m.type === 'ID-TAKEN' || m.type === 'INVALID-KEY' || m.type === 'ERROR') {
          finish('broker', 'The connection service refused: ' + (body.msg || m.type));
        }
      } catch (e) { finish('broker', e && e.message ? e.message : String(e)); }
    };
  });
}

// ── the PC's sound ────────────────────────────────────────────────────────────────────────────
/** Plays the blocks of desktop audio the PC sends, as raw PCM or as AAC frames. */
class Sound {
  constructor() { this.ctx = null; this.next = 0; this.decoder = null; this.shape = ''; }
  start() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    this.ctx.resume();
    this.next = 0;
  }
  stop() {
    try { this.decoder && this.decoder.state !== 'closed' && this.decoder.close(); } catch {}
    this.decoder = null; this.shape = '';
    if (this.ctx) { this.ctx.close().catch(() => {}); this.ctx = null; }
  }
  /** AAC needs a decoder; PCM does not, and costs 1.5 Mbps instead of a twelfth of that. */
  static aacOk() { return 'AudioDecoder' in window; }
  offer(codec, rate, channels, data) {
    if (!this.ctx) return;
    if (codec === 0) {
      const frames = Math.floor(data.length / 2 / channels);
      const view = new DataView(data.buffer, data.byteOffset, data.length);
      const planes = Array.from({ length: channels }, () => new Float32Array(frames));
      for (let i = 0, at = 0; i < frames; i++) for (let c = 0; c < channels; c++, at += 2) planes[c][i] = view.getInt16(at, true) / 32768;
      this.play(planes, rate);
    } else if (Sound.aacOk()) {
      const shape = rate + 'x' + channels;
      if (this.shape !== shape) {
        try { this.decoder && this.decoder.close(); } catch {}
        const idx = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000].indexOf(rate);
        // AudioSpecificConfig: object type 2 (AAC-LC), sampling index, channel count.
        const asc = Uint8Array.of((2 << 3) | (idx >> 1), ((idx & 1) << 7) | (channels << 3));
        this.decoder = new AudioDecoder({
          output: (ad) => {
            const planes = [];
            for (let c = 0; c < ad.numberOfChannels; c++) { const p = new Float32Array(ad.numberOfFrames); ad.copyTo(p, { planeIndex: c, format: 'f32-planar' }); planes.push(p); }
            const r = ad.sampleRate; ad.close(); this.play(planes, r);
          },
          error: () => {},
        });
        this.decoder.configure({ codec: 'mp4a.40.2', sampleRate: rate, numberOfChannels: channels, description: asc });
        this.shape = shape;
      }
      try { this.decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: Math.round(this.ctx.currentTime * 1e6), data })); } catch {}
    }
  }
  play(planes, rate) {
    const ctx = this.ctx; if (!ctx) return;
    const buf = ctx.createBuffer(planes.length, planes[0].length, rate);
    planes.forEach((p, c) => buf.copyToChannel(p, c));
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
    const now = ctx.currentTime;
    // A little ahead of now keeps jitter from becoming gaps; far ahead would be lag.
    if (this.next < now + 0.02 || this.next > now + 0.4) this.next = now + 0.06;
    src.start(this.next); this.next += buf.duration;
  }
}

// ── one session with one PC ───────────────────────────────────────────────────────────────────
class Session {
  /**
   * `pc` is a PC to reconnect to: with a `secret` it is a paired device, with a `key` a password
   * sign-in. With no `pc`, `code` pairs with whichever PC shows that code.
   */
  constructor(pc, code, ui) {
    this.pc = pc; this.code = code; this.ui = ui;
    this.mode = code ? 'code' : pc && pc.key ? 'password' : 'device';
    this.buf = new Uint8Array(0);
    this.link = null; this.alive = false; this.over = false;
    this.nonce = null; this.host = null; this.authed = false; this.caps = 0;
    this.cfg = null; this.decoder = null; this.rois = new Map(); this.seq = 0;
    this.pingTimer = null; this.fatal = null;
  }

  async connect() {
    const target = this.code ? 'freewatch-pair-' + normaliseCode(this.code)
      : this.pc.hostId ? 'freewatch-' + this.pc.hostId : 'freewatch-pw-' + this.pc.rendezvous;
    this.target = target;
    try {
      this.link = await openLink(target, { bytes: (b) => this.receive(b), close: () => this.ended() });
    } catch (e) {
      // Found by password alone, a PC that is not there and a password that is wrong look the same
      // from here, and the honest message names both.
      if (e.kind === 'offline' && this.mode === 'password' && !this.pc.hostId) e.message = 'No PC answers to that password. Check it, and that the PC is on and running FreeWatch.';
      else if (e.kind === 'offline' && this.mode === 'code') e.message = 'No PC is showing that code. Check it, and that FreeWatch is open on the PC and online.';
      throw e;
    }
    this.alive = true;
    this.ui.status('Checking that it is really your PC…');
    const { w, h } = this.ui.viewportPixels();
    this.send(new Out().u8(C.HELLO).u16(w).u16(h).u8(1).done());
    const id = enc.encode(mem.clientId), name = enc.encode(this.ui.deviceName());
    const body = new Out().u8(2).u16(0).u8(id.length).raw(id).u8(name.length).raw(name).done();
    this.send(new Out().u8(C.IDENT).u16(body.length).raw(body).done());
    this.pingTimer = setInterval(() => this.send(Uint8Array.of(C.PING)), 2000);
  }

  send(bytes) { if (this.link && this.alive) this.link.send(bytes); }

  close() {
    this.over = true;
    this.alive = false;
    clearInterval(this.pingTimer);
    try { this.decoder && this.decoder.state !== 'closed' && this.decoder.close(); } catch {}
    if (this.link) this.link.close();
  }

  ended() {
    if (!this.alive) return;
    this.alive = false;
    clearInterval(this.pingTimer);
    this.ui.ended(this.fatal, this);
  }

  // ── parsing: whole messages only, whatever sizes the channel delivers them in ──
  receive(chunk) {
    this.buf = this.buf.length ? concat(this.buf, chunk) : chunk;
    try { this.parse(); } catch (e) { console.error(e); this.fatal = 'The PC sent something this page could not read.'; this.close(); this.ui.ended(this.fatal, this); }
  }

  parse() {
    for (;;) {
      const b = this.buf, n = b.length;
      if (n < 1) return;
      const v = new DataView(b.buffer, b.byteOffset, n);
      let used = 0;
      switch (b[0]) {
        case S.IDENT: {
          if (n < 3) return; const len = v.getUint16(1); if (n < 3 + len) return;
          this.onIdent(b.subarray(3, 3 + len)); used = 3 + len; break;
        }
        case S.CHALLENGE: { if (n < 17) return; this.onChallenge(b.slice(1, 17)); used = 17; break; }
        case S.AUTH: {
          if (n < 2) return;
          const result = b[1];
          let need = 2;
          if (result === AUTH.OK) need = 34;
          else if (result === AUTH.PAIRED) { if (n < 3) return; need = 3 + b[2] + 32; }
          if (n < need) return;
          this.onAuth(result, b.slice(2, need)); used = need; break;
        }
        case S.CONFIG: {
          if (n < 13) return; const csd = v.getUint32(9); if (n < 13 + csd) return;
          this.onConfig(v.getUint16(1), v.getUint16(3), v.getUint16(5), v.getUint16(7), b.slice(13, 13 + csd)); used = 13 + csd; break;
        }
        case S.FRAME: {
          if (n < 14) return; const len = v.getUint32(10); if (n < 14 + len) return;
          this.onFrame(b[1] & 1, [v.getUint16(2), v.getUint16(4), v.getUint16(6), v.getUint16(8)], b.subarray(14, 14 + len)); used = 14 + len; break;
        }
        case S.PONG: used = 1; break;
        case S.FOCUS: { if (n < 18) return; used = 18; break; }
        case S.CURSOR: { if (n < 9) return; this.ui.cursor(v.getInt32(1), v.getInt32(5)); used = 9; break; }
        case S.AUDIO: {
          if (n < 11) return; const len = v.getUint32(7); if (n < 11 + len) return;
          this.ui.sound.offer(b[1], v.getUint32(2), b[6], b.slice(11, 11 + len)); used = 11 + len; break;
        }
        case S.FIELD: { if (n < 27) return; const len = v.getUint32(23); if (n < 27 + len) return; used = 27 + len; break; }
        default: throw new Error('unknown message 0x' + b[0].toString(16));
      }
      this.buf = this.buf.subarray(used);
    }
  }

  onIdent(body) {
    const idLen = body[3];
    const id = dec.decode(body.subarray(4, 4 + idLen));
    const nameLen = body[4 + idLen];
    this.host = { id, name: dec.decode(body.subarray(5 + idLen, 5 + idLen + nameLen)) };
    this.caps = body.length > 5 + idLen + nameLen ? body[5 + idLen + nameLen] : 0;
  }

  async onChallenge(nonce) {
    this.nonce = nonce;
    if (this.code) {
      const code = enc.encode(normaliseCode(this.code));
      this.send(new Out().u8(C.PAIR).u8(code.length).raw(code).done());
    } else if (this.mode === 'password') {
      const proof = await hmac(unhex(this.pc.key), 'freewatch/1 password client', nonce);
      this.send(concat(Uint8Array.of(C.PASSWORD), proof));
    } else {
      const proof = await hmac(unhex(this.pc.secret), 'freewatch/1 client', nonce);
      const id = enc.encode(this.pc.credId);
      this.send(new Out().u8(C.AUTH).u8(id.length).raw(id).raw(proof).done());
    }
  }

  async onAuth(result, rest) {
    const fail = (text, why) => { this.fatal = text; this.why = why || 'refused'; this.close(); this.ui.ended(text, this); };
    if (result === AUTH.OK) {
      const secret = this.mode === 'password' ? this.pc.key : this.pc.secret;
      const expected = await hmac(unhex(secret), 'freewatch/1 host', this.nonce);
      if (!same(rest, expected)) return fail('Something answered as that PC but could not prove it is. Not connecting.', 'impostor');
    } else if (result === AUTH.PAIRED) {
      const idLen = rest[0];
      const credId = dec.decode(rest.subarray(1, 1 + idLen));
      const secret = hex(rest.subarray(1 + idLen, 33 + idLen));
      this.pc = { hostId: this.host.id, name: this.host.name, credId, secret, last: Date.now() };
      mem.pcs = mem.pcs.filter((p) => p.hostId !== this.pc.hostId).concat(this.pc);
      mem.lastHost = this.pc.hostId;
      persist();
      this.code = null;
    } else if (result === AUTH.DENIED) {
      if (this.mode === 'password') return fail('That PC has no password set. Pair a device first and set one from the key button.', 'nopassword');
      mem.pcs = mem.pcs.filter((p) => !this.pc || p.hostId !== this.pc.hostId);
      persist();
      return fail('That PC no longer recognises this browser. It was forgotten on the PC.', 'forgotten');
    } else if (result === AUTH.LOCKED) {
      return fail(this.mode === 'password'
        ? 'Too many tries. Wait a little, then try again.'
        : 'Too many tries. The PC is showing a new code.', 'locked');
    } else {
      return fail(this.mode === 'password' ? 'That password did not match. Check it and try again.' : 'That code did not match. Check the PC and try again.', 'wrong');
    }
    this.authed = true;
    if (this.mode === 'password' && this.host) {
      this.pc.name = this.host.name || this.pc.name;
      this.pc.hostId = this.host.id;
      // A password sign-in is kept only when asked for, and then as the derived key, never the password.
      if (this.pc.remember) { mem.pcs = mem.pcs.filter((p) => p.hostId !== this.host.id).concat({ hostId: this.host.id, name: this.pc.name, key: this.pc.key, last: Date.now() }); mem.lastHost = this.host.id; persist(); }
    } else if (this.pc) { this.pc.last = Date.now(); persist(); }
    this.afterAuth();
    this.ui.authed(this.pc, this);
  }

  /** What this client is, and the most it wants sent: told once the door is open. */
  async afterAuth() {
    if (this.caps & CAP.ROLE) this.send(Uint8Array.of(C.ROLE, 2, 0));
    const path = await this.link.path();
    this.ui.pathKind = path;
    this.applyLimits(path);
    this.ui.restoreWishes(this);
  }

  applyLimits(path) {
    if (!(this.caps & CAP.LIMITS)) return;
    const l = EFFORT_LIMITS[cfg().effort];
    if (!l) { this.send(new Out().u8(C.LIMITS).u8(0).u16(0).done()); return; }
    const relay = (path || this.ui.pathKind) === 'relay';
    this.send(new Out().u8(C.LIMITS).u8(relay ? l[2] : l[0]).u16(relay ? l[3] : l[1]).done());
  }

  // ── video ──
  onConfig(srcW, srcH, encW, encH, csd) {
    this.cfg = { srcW, srcH, encW, encH, csd };
    this.ui.source(srcW, srcH);
    if (!('VideoDecoder' in window)) {
      this.fatal = 'This browser cannot play the video. Use a recent Chrome, Edge or Safari.'; this.why = 'unsupported';
      this.close(); this.ui.ended(this.fatal, this); return;
    }
    const sps = nalOfType(csd, 7);
    if (!sps || sps.length < 4) return;
    const codec = 'avc1.' + hex(sps.subarray(1, 4));
    try { this.decoder && this.decoder.state !== 'closed' && this.decoder.close(); } catch {}
    this.rois.clear();
    this.needKey = true;
    const config = { codec, codedWidth: encW, codedHeight: encH, optimizeForLatency: true, avc: { format: 'annexb' } };
    // A browser built without H.264 (some Chromium and Linux builds) connects fine and then can never
    // show a picture. Say so, instead of leaving "connected but not sending its screen".
    const cannotPlay = () => {
      if (this.fatal || this.decoded) return;
      this.fatal = 'This browser connected, but it cannot play the PC’s H.264 video. Use Chrome, Edge or Safari, or install the codec your browser is missing.'; this.why = 'unsupported';
      this.close(); this.ui.ended(this.fatal, this);
    };
    this.decoded = false;
    this.decoder = new VideoDecoder({
      output: (frame) => { this.decoded = true; this.ui.picture(frame, this.rois.get(frame.timestamp) || [0, 0, srcW, srcH]); },
      error: (e) => { console.error(e); this.ui.panel.noPicture(this.ui.name, 'The video stopped. Reconnecting…'); },
    });
    VideoDecoder.isConfigSupported(config).then((r) => { if (!r.supported) cannotPlay(); }, () => {});
    this.decoder.configure(config);
  }

  onFrame(key, roi, data) {
    if (!this.decoder || this.decoder.state !== 'configured') return;
    if (this.needKey && !key) return;
    // A queue this long means the page is behind; waiting for the next keyframe is the way back.
    if (this.decoder.decodeQueueSize > 40 && !key) return;
    this.needKey = false;
    const ts = ++this.seq;
    this.rois.set(ts, roi);
    if (this.rois.size > 120) this.rois.delete(this.rois.keys().next().value);
    // Annex-B decoding wants the headers in the stream; the PC sends them once, up front.
    const payload = key && !hasNal(data, 7) ? concat(this.cfg.csd, data) : data;
    this.decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts, data: payload }));
  }
}

/**
 * What a password becomes. One slow PBKDF2 gives a master; two labelled HMACs of it give the key
 * that proves the password and the name the PC is found under, so typing the password alone is
 * enough to find the PC and to prove it. The PC derives exactly the same (`derive_master` and
 * `PasswordKeys` in `host/src/auth.rs`), and a test there pins the two together.
 */
async function passwordKeys(password) {
  const base = await crypto.subtle.importKey('raw', enc.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
  const master = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ROUNDS, salt: enc.encode('freewatch/1 password v2') }, base, 256));
  const mac = await crypto.subtle.importKey('raw', master, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const label = async (text) => new Uint8Array(await crypto.subtle.sign('HMAC', mac, enc.encode(text)));
  return { master, auth: hex(await label('freewatch/1 auth')), rendezvous: hex((await label('freewatch/1 rendezvous')).subarray(0, 16)) };
}

/** A PC id from what someone pasted: the bare id, or the web link that carries it. */
function hostIdFrom(text) {
  const m = String(text).match(/(?:pc=)?([0-9a-f]{16})\b/i);
  return m ? m[1].toLowerCase() : null;
}

async function hmac(secret, label, nonce) {
  const key = await crypto.subtle.importKey('raw', secret, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', key, concat(enc.encode(label), nonce)));
}

/** Annex-B NAL units of one type, without their start codes. */
function nalUnits(b) {
  const starts = [];
  for (let i = 0; i + 3 <= b.length; i++) if (b[i] === 0 && b[i + 1] === 0 && b[i + 2] === 1) { starts.push(i + 3); i += 2; }
  return starts.map((from, k) => {
    let to = k + 1 < starts.length ? starts[k + 1] - 3 : b.length;
    while (to > from && b[to - 1] === 0) to--;
    return b.subarray(from, to);
  });
}
const nalOfType = (b, t) => nalUnits(b).find((n) => n.length && (n[0] & 31) === t);
const hasNal = (b, t) => !!nalOfType(b.subarray(0, Math.min(b.length, 256)), t);

// ── small pieces of interface ─────────────────────────────────────────────────────────────────
let toastTimer = 0;
function toast(text) {
  const t = $('toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3800);
}
const buzz = (ms = 8) => { if (cfg().haptics && navigator.vibrate) try { navigator.vibrate(ms); } catch {} };

/**
 * A bottom sheet, the way the apps ask for one thing at a time. Returns a handle to put content in
 * and to read results from; `close()` and Escape both end it.
 */
function sheet(title, message) {
  const dlg = el('dialog', { class: 'sheet', 'aria-label': title });
  const body = el('div', { class: 'in-sheet' }, el('div', { class: 'grab' }), el('h2', { text: title }));
  if (message) body.append(el('p', { class: 'sub', text: message }));
  dlg.append(body);
  document.body.append(dlg);
  const h = {
    dlg, body,
    onClose: null,
    add(node) { body.insertBefore(node, h.status); return node; },
    field(label, props = {}) {
      const input = el('input', { class: 'in' + (props.code ? ' code' : ''), type: props.type || 'text', autocomplete: props.autocomplete || 'off', spellcheck: 'false', placeholder: props.placeholder || '', inputmode: props.inputmode, enterkeyhint: 'go', autocapitalize: props.code ? 'characters' : 'off', 'aria-label': label });
      h.add(input);
      return input;
    },
    status: el('p', { class: 'msg', role: 'status' }),
    say(text, kind) { h.status.textContent = text; h.status.className = 'msg' + (kind ? ' ' + kind : ''); },
    button(label, o = {}) {
      const b = el('button', { class: 'btn' + (o.ghost ? ' ghost' : '') + (o.danger ? ' danger' : ''), type: 'button', text: label });
      b.onclick = () => { if (o.close !== false) h.close(); o.click && o.click(b); };
      body.append(b);
      return b;
    },
    choice(title, detail, click) {
      const b = el('button', { class: 'choice', type: 'button' }, el('div', {}, el('b', { text: title }), detail ? el('span', { text: detail }) : null));
      b.onclick = () => { h.close(); click(); };
      body.append(b);
      return b;
    },
    close() { if (dlg.open) dlg.close(); },
  };
  body.append(h.status);
  dlg.addEventListener('close', () => { dlg.remove(); h.onClose && h.onClose(); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) h.close(); });
  dlg.showModal();
  return h;
}

// ── the connection panel: what the viewer says until there is a picture ──────────────────────
/**
 * The phone's own words for each state (`ConnectionPanel.kt`): always says what is happening and
 * why, and always offers the next step. Opaque until a picture has been shown, then a translucent
 * card over the last frame, so a reconnect does not throw away what was on screen.
 */
const panel = {
  hadPicture: false, action: null,
  show(title, text, { working = false, action = null, onAction = null } = {}) {
    $('pTitle').textContent = title; $('pText').textContent = text || '';
    $('pText').hidden = !text;
    $('spin').hidden = !working;
    $('pAction').hidden = !action; $('pAction').textContent = action || '';
    this.action = onAction;
    $('panel').classList.toggle('over', this.hadPicture);
    $('panel').hidden = false;
  },
  connecting(name) { this.show(this.hadPicture ? 'Reconnecting…' : 'Connecting to ' + name, 'Looking for it on any network.', { working: true }); },
  waiting(name, reason, secs, onRetry) { this.show('Can\'t reach ' + name, reason + (secs ? '\n\nTrying again in ' + secs + 's.' : ''), { action: 'Retry now', onAction: onRetry }); },
  awaiting(name) { this.show('Connected to ' + name, 'Waiting for the picture…', { working: true }); },
  noPicture(name, text) { this.show('No picture from ' + name, text || 'It is connected but not sending its screen. If it is locked or showing a security prompt, the picture comes back on its own once it is unlocked.', { working: true }); },
  refused(title, text, action, onAction) { this.show(title, text, { action, onAction }); },
  hide() { this.hadPicture = true; $('panel').hidden = true; },
  reset() { this.hadPicture = false; },
};
$('pAction').onclick = () => panel.action && panel.action();
$('pBack').onclick = () => ui.leave();

// ── the screen, and the mouse and keyboard that drive it ─────────────────────────────────────
const canvas = $('view');
const ctx = canvas.getContext('2d');
const ui = {
  session: null, src: null, view: null, frame: null, frameRoi: null, cursorAt: null,
  frames: 0, dpr: 1, roiTimer: 0, wake: null, lastPicture: 0, name: 'your PC', pathKind: '',
  wantAudio: false, wantDark: false, panel, sound: new Sound(), pictureShown: false,

  deviceName() {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    const os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
    return `Web · ${browser}${os ? ' on ' + os : ''}`;
  },
  viewportPixels() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    return { w: Math.round(window.innerWidth * dpr), h: Math.round(window.innerHeight * dpr) };
  },
  status() {},

  /** The door opened: show the viewer, and say the picture is on its way. */
  authed(pc, session) {
    if (session !== app.session) return;
    app.retries = 0;
    app.target = { pc };
    this.name = pc ? pc.name : this.name;
    if (app.sheet) { const s = app.sheet; app.sheet = null; s.onClose = null; s.close(); }
    showStage();
    panel.awaiting(this.name);
    if (matchMedia('(pointer: coarse)').matches && innerHeight > innerWidth) toast('Tip: the rotate button gives a much bigger picture.');
    clearTimeout(this.noPicture); this.noPicture = setTimeout(() => { if (!this.pictureShown && app.session === session) panel.noPicture(this.name); }, 6000);
    this.lastPicture = performance.now();
    this.resize();
    canvas.focus({ preventScroll: true });
    applyOptions();
    acquireWake();
    renderHome();
  },

  restoreWishes(session) {
    if (session !== app.session) return;
    if (this.wantAudio) requestAudio(true);
    if (this.wantDark) session.send(Uint8Array.of(C.DISPLAY, 0));
  },

  source(w, h) {
    const first = !this.src || this.src.w !== w || this.src.h !== h;
    this.src = { w, h };
    if (first) this.view = { x: 0, y: 0, w, h };
    this.draw();
  },

  picture(frame, roi) {
    this.lastPicture = performance.now();
    if (this.frame) this.frame.close();
    this.frame = frame; this.frameRoi = roi; this.frames++;
    if (!this.pictureShown) { this.pictureShown = true; clearTimeout(this.noPicture); panel.hide(); }
    if (!this.pending) this.pending = requestAnimationFrame(() => { this.pending = 0; this.draw(); });
  },

  cursor(x, y) { this.cursorAt = [x, y]; if (!this.pending) this.pending = requestAnimationFrame(() => { this.pending = 0; this.draw(); }); },

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    this.dpr = dpr;
    this.draw();
  },

  /** Scale and offset that fit the requested crop inside the canvas, centred. */
  fit() {
    const v = this.view, pick = cfg().fit === 'cover' ? Math.max : Math.min, s = pick(canvas.width / v.w, canvas.height / v.h);
    return { s, ox: (canvas.width - v.w * s) / 2, oy: (canvas.height - v.h * s) / 2 };
  },

  draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!this.frame || !this.view) return;
    const { s, ox, oy } = this.fit(), r = this.frameRoi, v = this.view;
    // The frame is placed where its own crop sits in the current view, so a zoom in flight shows
    // the old picture stretched into place until the sharper one arrives.
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(this.frame, ox + (r[0] - v.x) * s, oy + (r[1] - v.y) * s, r[2] * s, r[3] * s);
    if (this.cursorAt && cfg().pointer) {
      const x = ox + (this.cursorAt[0] - v.x) * s, y = oy + (this.cursorAt[1] - v.y) * s, u = this.dpr;
      ctx.lineWidth = 2 * u; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.fillStyle = '#ff4d97';
      ctx.beginPath(); ctx.arc(x, y, 6 * u, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * u; ctx.stroke();
    }
  },

  /** Canvas pixel (CSS) to a desktop pixel, or null off the desktop. */
  toSource(cx, cy) {
    if (!this.view || !this.src) return null;
    const { s, ox, oy } = this.fit(), u = this.dpr;
    const x = Math.round(this.view.x + (cx * u - ox) / s), y = Math.round(this.view.y + (cy * u - oy) / s);
    return [Math.min(Math.max(x, 0), this.src.w - 1), Math.min(Math.max(y, 0), this.src.h - 1)];
  },

  /** Zoom by `factor` about a canvas point, keeping that point under the finger or pointer. */
  zoom(factor, cx, cy) {
    if (!this.view || !this.src) return;
    const { w: sw, h: sh } = this.src, v = this.view;
    const at = this.toSource(cx ?? canvas.clientWidth / 2, cy ?? canvas.clientHeight / 2);
    const nw = Math.min(sw, Math.max(sw / 20, v.w / factor)), nh = nw * (sh / sw);

    this.draw();
  },

  pan(dxCss, dyCss) {
    if (!this.view || !this.src) return;
    const { s } = this.fit(), u = this.dpr, v = this.view;
    this.view = { ...v, x: Math.min(Math.max(v.x - (dxCss * u) / s, 0), this.src.w - v.w), y: Math.min(Math.max(v.y - (dyCss * u) / s, 0), this.src.h - v.h) };
    this.askForView();
    this.draw();
  },

  /** Tell the PC which part of the desktop to send, once the view has stopped moving. */
  askForView() {
    clearTimeout(this.roiTimer);
    this.roiTimer = setTimeout(() => {
      const v = this.view, s = app.session;
      if (!s || !s.alive || !v) return;
      s.send(new Out().u8(C.ROI).u16(Math.round(v.x)).u16(Math.round(v.y)).u16(Math.round(v.w)).u16(Math.round(v.h)).done());
    }, 90);
  },

  /** The link ended, for a reason (refused for good) or none (it dropped). */
  ended(reason, session) {
    if (session !== app.session) return;
    this.pictureShown = false;
    clearTimeout(this.noPicture);
    if (reason) return refused(session, reason);
    if (app.opts.sheet && !session.authed) { app.session = null; app.opts.sheet.fail('The connection dropped before it finished. Try again.', null); return; }
    // The link dropped. Try again, a little slower each time, for as long as the page is open.
    const pc = session.pc;
    if (!pc || !cfg().reconnect || !app.stage) { app.session = null; if (app.stage) { panel.refused('Connection lost', 'The connection dropped.', 'Reconnect', () => pc && connect({ pc }, {})); } return; }
    panel.connecting(this.name);
    const wait = Math.min(1000 * 2 ** app.retries++, 15000);
    clearTimeout(app.retryTimer);
    app.retryTimer = setTimeout(() => { if (app.session === session) connect({ pc }, {}); }, wait);
  },

  leave() {
    const s = app.session;
    app.session = null;
    clearTimeout(app.retryTimer); clearInterval(app.tick); clearTimeout(this.noPicture);
    if (s) s.close();
    if (app.sheet) { const sh = app.sheet; app.sheet = null; sh.onClose = null; sh.close(); }
    this.sound.stop(); this.wantAudio = false; this.wantDark = false;
    this.pictureShown = false; this.pathKind = '';
    $('chipAudio').classList.remove('on'); $('chipDark').classList.remove('on');
    showHome();
    if (this.frame) { this.frame.close(); this.frame = null; }
    this.cursorAt = null; this.view = null; this.src = null;
    panel.reset();
    try { this.wake && this.wake.release(); } catch {}
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch {}
    closeCompose();
    renderHome();
  },
};

// ── the app: what is on screen, and how a connection is begun, retried and ended ────────────
const app = {
  session: null, target: null, opts: {}, retries: 0, retryTimer: 0, tick: 0, sheet: null, stage: false,
};

function showStage() {
  app.stage = true;
  $('home').hidden = true; $('settings').hidden = true; $('stage').hidden = false;
  $('panel').hidden = false;
  ui.resize();
  showChips();
}
function showHome() {
  app.stage = false;
  $('stage').hidden = true; $('settings').hidden = true; $('home').hidden = false;
}

/** Begin a connection to `target`: `{ pc }` for a PC this browser knows, `{ code }` to pair. */
async function connect(target, opts = {}) {
  clearTimeout(app.retryTimer); clearInterval(app.tick);
  if (!window.isSecureContext || !crypto.subtle) { toast('This page needs https to keep your login safe. Open it from its https address.'); return; }
  if (app.session) { const old = app.session; app.session = null; old.close(); }
  const session = new Session(target.pc || null, target.code || null, ui);
  app.session = session; app.target = target; app.opts = opts;
  ui.name = (target.pc && target.pc.name) || ui.name;
  if (target.pc && target.pc.name === 'PC' && !target.pc.hostId) ui.name = 'your PC';
  ui.pictureShown = false;
  if (!opts.sheet) { showStage(); panel.connecting(ui.name); }
  try {
    await session.connect();
  } catch (e) {
    if (app.session !== session) return;
    app.session = null;
    if (opts.sheet) { opts.sheet.fail(e.message, e); return; }
    unreachable(e, target);
  }
}

/** The PC could not be reached. Say why, and keep trying in the background like the app does. */
function unreachable(e, target) {
  const retry = () => { clearTimeout(app.retryTimer); clearInterval(app.tick); connect(app.target || target, {}); };
  if (!cfg().reconnect) { panel.waiting(ui.name, e.message, 0, retry); return; }
  let secs = Math.min(3 * 2 ** app.retries++, 30);
  const draw = () => panel.waiting(ui.name, e.message, secs, retry);
  draw();
  clearInterval(app.tick);
  app.tick = setInterval(() => { secs--; if (secs <= 0) retry(); else draw(); }, 1000);
}

/** The PC turned this browser away for good. Say so, and do not pretend to keep trying. */
function refused(session, reason) {
  const why = session.why;
  app.session = null;
  // The sheet only answers for a link that has not signed in yet; after that it has closed.
  if (app.opts.sheet && !session.authed) { app.opts.sheet.fail(reason, { kind: why }); return; }

// ── the connection check ─────────────────────────────────────────────────────────────────────
/**
 * Look at this device's own network the way a connection would: can it reach the connection
 * service, does it have a public address, is it IPv6 only, does its router change its answer per
 * destination, and does the relay (if there is one) work. It cannot see the PC's side, but the
 * failure message names that when a connection was tried.
 */
async function doctor() {
  const s = sheet('Check my connection', 'What this device\'s network can do. It takes a few seconds.');
  const list = s.add(el('div', { class: 'diag' }));
  const row = (label, text, kind) => { const r = el('div', { class: 'row' }, el('span', { text: label }), el('b', { class: kind || '', text })); list.append(r); return r; };
  const verdict = s.add(el('p', { class: 'sub' }));
  s.button('Done', { ghost: true });
  const wait = row('Checking…', '…', 'warn');

  const broker = await new Promise((resolve) => {
    let done = false;
    const end = (v) => { if (!done) { done = true; clearTimeout(t); try { w.close(); } catch {} resolve(v); } };
    let w; try { w = new WebSocket(`${brokerUrl()}?key=peerjs&id=fwchk${rand(6)}&token=${rand(6)}&version=1.5.4`); } catch { return resolve(false); }
    const t = setTimeout(() => end(false), 6000);
    w.onmessage = (e) => { try { if (JSON.parse(e.data).type === 'OPEN') end(true); } catch {} };
    w.onerror = () => end(false); w.onclose = () => end(false);
  });
  const t = tally();
  const pc = new RTCPeerConnection({ iceServers: iceServers() });
  pc.createDataChannel('x');
  const errors = [];
  pc.onicecandidateerror = (e) => { if (/turn/i.test(e.url || '')) errors.push(e); };
  const gathered = new Promise((resolve) => { pc.onicecandidate = (e) => { if (!e.candidate) resolve(); else note(t, e.candidate.candidate); }; setTimeout(resolve, 7000); });
  await pc.setLocalDescription(await pc.createOffer());
  await gathered;
  pc.close();
  wait.remove();

  row('Connection service', broker ? 'Reachable' : 'Not reachable', broker ? 'ok' : 'bad');
  row('Public address (IPv4)', t.srflx ? 'Found' : 'None', t.srflx ? 'ok' : 'warn');
  row('IPv6', t.v6 ? 'Yes' : 'No', t.v6 ? 'ok' : '');
  row('Router', !t.srflx ? 'Unknown' : strict(t) ? 'Strict (changes per destination)' : 'Friendly', !t.srflx ? '' : strict(t) ? 'bad' : 'ok');
  row('Relay', turnUrls(cfg().turn).length ? (t.relay ? 'Working' : 'Not answering') : 'Not set up', turnUrls(cfg().turn).length ? (t.relay ? 'ok' : 'bad') : '');
  verdict.textContent = !broker ? 'This browser cannot reach the connection service, so nothing can connect. Check the internet, or the address in Settings.'
    : t.relay ? 'Good. If a direct path is blocked the relay will carry it.'
    : strict(t) ? 'Your router is the strict kind (mobile data usually is). Connecting from here to a PC across the internet will often fail without a relay. Same Wi-Fi works; so does a relay set in Settings.'
    : !t.srflx && !t.v6 ? 'This network blocks the lookup that lets two devices find each other. Try another network, or set a relay in Settings.'
    : t.v6 && !t.srflx ? 'This network is IPv6 only. A PC without IPv6 cannot be reached directly from here; a relay in Settings fixes that.'
    : 'This network can connect directly. If a PC still cannot be reached, the problem is on its side.';
}

  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;

  gesture = { moved: false, count: touches.size, dist: pinchDistance(), lastY: avg('y') };
  clearTimeout(longPress);
  const r = canvas.getBoundingClientRect();
  // Tap, then touch again and keep hold: that second touch drags (select text, move a window).
  if (touches.size === 1 && lastTap && performance.now() - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
    const at = ui.toSource(e.clientX - r.left, e.clientY - r.top);
    if (at) { input(IN.MOVE, at[0], at[1]); input(IN.BUTTON, 0, 1); gesture.drag = true; buzz(10); }
  } else if (touches.size === 1 && cfg().longpress) longPress = setTimeout(() => {
    const p = touches.values().next().value; if (!p || gesture.moved) return;
    const at = ui.toSource(p.x - r.left, p.y - r.top);
    if (at) { input(IN.MOVE, at[0], at[1]); input(IN.BUTTON, 1, 1); input(IN.BUTTON, 1, 0); gesture.done = true; buzz(15); }
  }, 550);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') { const at = ui.toSource(e.offsetX, e.offsetY); if (at) sendMove(at); return; }
  const p = touches.get(e.pointerId); if (!p || !gesture) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(p.x - p.sx, p.y - p.sy) > 8) { gesture.moved = true; clearTimeout(longPress); }
  if (gesture.drag) { const at = ui.toSource(p.x - canvas.getBoundingClientRect().left, p.y - canvas.getBoundingClientRect().top); if (at) sendMove(at); return; }
  if (touches.size >= 2) {
    // Two fingers: spread to zoom, drag to scroll the remote page.
    const d = pinchDistance(), r = canvas.getBoundingClientRect();
    if (gesture.dist && Math.abs(d - gesture.dist) > 2) { ui.zoom(d / gesture.dist, avg('x') - r.left, avg('y') - r.top); gesture.dist = d; }
    const y = avg('y'), sy = y - gesture.lastY; gesture.lastY = y;
    if (Math.abs(sy) > 0.5 && Math.abs(d - gesture.dist) < 3) { const at = ui.toSource(canvas.clientWidth / 2, canvas.clientHeight / 2); if (at) { input(IN.MOVE, at[0], at[1]); input(IN.SCROLL, 0, Math.round(sy * 2 * cfg().scroll)); } }
  } else if (gesture.moved && ui.view && ui.view.w < ui.src.w * 0.98) {
    // One finger on a zoomed view pans it.
    ui.pan(dx, dy);
  }

const lift = (e) => {
  if (e.pointerType === 'mouse') { const at = ui.toSource(e.offsetX, e.offsetY); if (at) { input(IN.MOVE, at[0], at[1]); input(IN.BUTTON, buttonOf(e), 0); } return; }
  const p = touches.get(e.pointerId); touches.delete(e.pointerId); clearTimeout(longPress);
  if (gesture && gesture.drag) { input(IN.BUTTON, 0, 0); gesture = touches.size ? gesture : null; lastTap = null; return; }
  if (p && gesture && !gesture.moved && !gesture.done && gesture.count === 1 && performance.now() - p.t < 400) {
    const r = canvas.getBoundingClientRect(), at = ui.toSource(p.x - r.left, p.y - r.top);
    if (at) { input(IN.MOVE, at[0], at[1]); input(IN.BUTTON, 0, 1); input(IN.BUTTON, 0, 0); buzz(); lastTap = { x: p.x, y: p.y, t: performance.now() }; }
  }
